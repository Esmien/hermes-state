# Контейнеры вне списка не трогаются никогда.
litellm
litellm-redis
open-webui
searxng
open-terminal
edge-tts
lyria-bot
lyria-generation-worker
lyria-enricher-worker
lyria-postgres:stateful
lyria-redis:stateful
lyria-rabbitmq:stateful
