# tmux — рабочий конфиг для сервера: мышь, truecolor, история 50k, удобный статус.
# Класть в ~/.tmux.conf. Проверен на tmux 3.4.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -sg escape-time 10
set -g set-clipboard on
set -g display-time 2000

set -g mode-keys vi
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "конфиг перезагружен"
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g status-interval 5
set -g status-style "bg=#1f2430,fg=#a0a8b7"
set -g status-left-length 40
set -g status-right-length 70
set -g status-left "#[bg=#4c566a,fg=#eceff4,bold] #S #[bg=#1f2430,fg=#4c566a]"
set -g status-right "#[fg=#88c0d0]#{?client_prefix,#[fg=#bf616a]PREFIX ,}#[fg=#a3be8c]#(cut -d' ' -f1-3 /proc/loadavg) #[fg=#81a1c1]%H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#4c566a,fg=#eceff4,bold] #I:#W #[default]"
set -g window-status-current-style "fg=#eceff4"
