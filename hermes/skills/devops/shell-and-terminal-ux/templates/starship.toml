# starship — конфиг, работающий без Nerd Font (символы ╭ ╰ ❯ ⌁ есть в любом моно-шрифте).
# Класть в ~/.config/starship.toml.

add_newline = true
command_timeout = 2000
scan_timeout = 30

format = """
[╭─](bold blue)$username[ at ](bold black)$hostname[ in ](bold black)$directory$git_branch$git_status$python$docker_context$cmd_duration
[╰─](bold blue)$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[username]
style_user = "bold cyan"
style_root = "bold yellow"
format = "[$user]($style)"
show_always = false

[hostname]
ssh_only = false
format = "[$hostname](bold black)"
trim_at = "."

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "⌁ "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↑${ahead_count}↓${behind_count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[python]
symbol = "🐍 "
style = "bold yellow"
format = "[$symbol($version )(#$virtualenv)]($style)"

[docker_context]
symbol = "🐳 "
style = "bold blue"
format = "[$symbol$context]($style) "
only_with_files = false
disabled = false

[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "bold yellow"

[time]
disabled = true
time_format = "%H:%M"
style = "bold black"
format = "at [$time]($style)"

[fill]
symbol = " "

[package]
disabled = true
